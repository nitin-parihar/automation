name: Run Symphony

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VM_HOST: "10.139.9.151"
  VM_USER: "root"
  VM_PASS: "abc123"

jobs:
  deploy:
    #runs-on: ubuntu-latest
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Symphony repo on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          password: ${{ env.VM_PASS }}
          script: |
            echo "Cloning Symphony repository..."
            rm -rf ~/symphony
            git clone --depth 1 https://github.com/eclipse-symphony/symphony.git ~/symphony
            echo "Symphony cloned successfully!"
