name: TestCase Automation

on:
  workflow_dispatch:

jobs:
  wfm-setup:
    name: Run WFM Setup & Start Symphony
    runs-on: ubuntu-latest

    env:
      WFM_HOST: "10.139.9.90"
      WFM_USER: "margo"
      WFM_PASS: "Margo@123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WFM Setup
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          margo@10.139.9.90 \
          "cd ~/nitin/sandbox/pipeline && echo 1 | sudo -E bash wfm.sh"

      - name: Start Symphony
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          margo@10.139.9.90 \
          'cd ~/nitin/sandbox/pipeline && echo 3 | sudo -E bash wfm.sh'
