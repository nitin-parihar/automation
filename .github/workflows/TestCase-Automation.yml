name: TestCase Automation

on:
  workflow_dispatch:

jobs:
  wfm-setup:
    name: Run WFM Setup & Start Symphony
    runs-on: ubuntu-latest

    env:
      WFM_HOST: "10.139.9.151"
      WFM_USER: "root"
      WFM_PASS: "abc123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run WFM Setup
        run: |
          sshpass -p "$VM_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          "$VM_USER@$VM_HOST" \
          "cd ~/nitin/sandbox/pipeline && echo 1 | sudo -E bash wfm.sh"
